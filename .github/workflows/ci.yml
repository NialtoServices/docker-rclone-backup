name: CI
on:
  pull_request:
  push:
    branches:
      - main
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ github.sha }}
      push: false

  # The one check to require in branch protection: the matrix job names change with the images and
  # platforms, and a skipped or cancelled build would otherwise count as passing.
  ci-ok:
    name: CI passed
    if: always()
    needs:
      - build
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    env:
      BUILD_RESULT: ${{ needs.build.result }}
    steps:
      - name: Fail unless the build succeeded
        run: |
          [ "${BUILD_RESULT}" = success ]
