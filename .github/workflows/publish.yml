name: Publish
on:
  release:
    types:
      - published
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * 1'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
jobs:
  resolve:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      release: ${{ steps.release.outputs.release }}
      newest: ${{ steps.release.outputs.newest }}
      newest-in-major: ${{ steps.release.outputs.newest-in-major }}
      newest-in-minor: ${{ steps.release.outputs.newest-in-minor }}
    steps:
      # The script is read from the commit that triggered the run, which is the default branch for a
      # scheduled run and the release's tag for a published one.
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Resolve the release to build
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          TAGS="$(gh api "repos/${GITHUB_REPOSITORY}/tags" --paginate --jq '.[].name')"

          # Before the first release the weekly schedule has nothing to rebuild; an empty release
          # output skips the build and everything after it.
          if [ "${GITHUB_EVENT_NAME}" = schedule ] && ! grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' <<< "${TAGS}"
          then
            echo "::notice::No release yet, so there is nothing to rebuild"
            exit 0
          fi

          printf '%s\n' "${TAGS}" | .github/scripts/resolve-release >> "${GITHUB_OUTPUT}"
  build:
    if: needs.resolve.outputs.release != ''
    needs:
      - resolve
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ needs.resolve.outputs.release }}
      push: true
  merge:
    name: Merge ${{ matrix.image }}
    runs-on: ubuntu-26.04
    needs:
      - resolve
      - build
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image:
          - files
          - sqlite
          - postgres
          - mariadb
          - mysql
    env:
      REGISTRY_IMAGE: ghcr.io/nialtoservices/rclone-backup/${{ matrix.image }}
    steps:
      - name: Download digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-${{ matrix.image }}-*
          merge-multiple: true
      - name: Extract metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ needs.resolve.outputs.release }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.resolve.outputs.release }},enable=${{ needs.resolve.outputs.newest-in-minor }}
            type=semver,pattern={{major}},value=${{ needs.resolve.outputs.release }},enable=${{ needs.resolve.outputs.newest-in-major }}
            type=raw,value=latest,enable=${{ needs.resolve.outputs.newest }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Authenticate with the GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          mapfile -t TAG_OPTIONS < <(jq -r '.tags[] | "--tag=" + .' <<< "${DOCKER_METADATA_OUTPUT_JSON}")

          SOURCES=()
          for DIGEST in *
          do
            SOURCES+=("${REGISTRY_IMAGE}@sha256:${DIGEST}")
          done

          docker buildx imagetools create "${TAG_OPTIONS[@]}" "${SOURCES[@]}"
      - name: Inspect manifest list
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          docker buildx imagetools inspect "${REGISTRY_IMAGE}:${VERSION}"

  # This is a job of its own so that one ping follows all five images; a ping from each matrix leg
  # would let a monitor stay quiet about a single image that failed to merge.
  #
  # GitHub disables a scheduled workflow after 60 days without repository activity, and a run that
  # never starts can't report a failure. Renovate's merges are what normally count as that activity,
  # and a heartbeat monitor alerts when this ping stops.
  report:
    name: Report the rebuild
    if: github.event_name == 'schedule'
    runs-on: ubuntu-26.04
    needs:
      - merge
    timeout-minutes: 5
    permissions: {}
    env:
      REBUILD_MONITOR_URL: ${{ secrets.REBUILD_MONITOR_URL }}
    steps:
      - name: Report the scheduled rebuild to the monitor
        if: env.REBUILD_MONITOR_URL != ''
        run: |
          curl --fail --silent --show-error --output /dev/null --max-time 10 --retry 5 "${REBUILD_MONITOR_URL}"
