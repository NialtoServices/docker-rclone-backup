name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'

# The version comes from pull request labels, so commit subjects stay plain, with no Conventional
# Commits prefix. Renovate labels its pull requests by update type, and an unlabelled one counts as a
# patch.
version-resolver:
  major:
    labels:
      - major
  minor:
    labels:
      - minor
  patch:
    labels:
      - patch
  default: patch

# A change that only touches CI never reaches an image, so it neither appears in the notes nor
# raises the version.
exclude-labels:
  - ci

template: |
  ## Changes

  $CHANGES
